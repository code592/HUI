[package]
name = "hui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "hui"
path = "src/main.rs"

[lib]
name = "hui_app"
crate-type = ["rlib"]

[dependencies]
hui-core = { path = "../hui-core" }
hui-render = { path = "../hui-render" }
slint = { version = "=1.17.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
directories = "6"
ropey = "1.6.1"
serde_json = "1"
sys-locale = "=0.3.2"
anyhow = "1"
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "accessibility"] }
rfd = "0.15"
arboard = "3"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["unstable-fontique-010"] }

[build-dependencies]
slint-build = "=1.17.1"
