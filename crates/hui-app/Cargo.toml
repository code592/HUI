[package]
name = "hui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "hui"
path = "src/main.rs"

[dependencies]
hui-core = { path = "../hui-core" }
hui-render = { path = "../hui-render" }
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
rfd = "0.15"
directories = "6"
ropey = "1.6.1"
serde_json = "1"
sys-locale = "=0.3.2"
anyhow = "1"
arboard = "3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString"] }

[build-dependencies]
slint-build = "=1.17.1"
