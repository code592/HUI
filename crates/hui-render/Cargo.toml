[package]
name = "hui-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulldown-cmark = "0.13"
ammonia = "4"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
merman = "=0.8.0-alpha.6"
rquickjs = "=0.12.2"
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["svg", "woff", "system-fonts", "complex-scripts"] }
blitz-html = "=0.3.0-beta.2"
blitz-paint = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
anyrender = "=0.13.0"
base64 = "0.22"
url = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
anyrender_skia = "=0.11.0"
skia-safe = { version = "=0.99.0", features = ["pdf", "textlayout"] }
