plugins { id 'com.android.application' }
android {
    namespace 'dev.hui.markdown'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.hui.markdown'
        minSdk 29
        testInstrumentationRunner 'dev.hui.markdown.SmokeInstrumentation'
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        res.srcDirs = ['../res']
        assets.srcDirs = ['../generated/assets']
        jniLibs.srcDirs = ['../generated/jniLibs']
    }
    testBuildType 'preview'
    buildTypes {
        release { minifyEnabled false }
        preview {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['release']
        }
    }
}
